  <style>
    :root {

      color: #15203b;
      background: #f3f6fc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: clamp(32px, 7vw, 96px) 0; }

    .scene {
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      border: 1px solid #d6e1f3;
      border-radius: 12px;
      background: #fff;
      color: inherit;
      text-decoration: none;
    }
    .scene:hover { border-color: #4671d1; }
    .scene:focus-visible { outline: 3px solid #2759d2; outline-offset: 4px; }
    .scene img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; object-fit: cover; background: #e7edf9; }
    .scene > div { display: grid; gap: 7px; padding: 4px 16px 16px; }
    footer { margin-top: 24px; }
    footer a { color: #294c9f; text-underline-offset: 3px; }
    @media (max-width: 760px) {
      main { width: min(480px, calc(100% - 30px)); }
